<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background-color: #f4f6f9;
    }

    .sidebar {
      height: 100vh;
      background-color: #343a40;
      color: white;
      position: fixed;
      width: 240px;
    }

    .sidebar a {
      color: #adb5bd;
      text-decoration: none;
      display: block;
      padding: 12px 20px;
    }

    .sidebar a:hover {
      background-color: #495057;
      color: white;
    }

    .main-content {
      margin-left: 240px;
      padding: 20px;
    }

    .card {
      border: none;
      border-radius: 10px;
    }

    .card h5 {
      font-weight: bold;
    }

    .icon-box {
      font-size: 30px;
      padding: 10px;
      border-radius: 50%;
      color: white;
    }

    .bg-blue { background-color: #0d6efd; }
    .bg-green { background-color: #198754; }
    .bg-orange { background-color: #fd7e14; }
    .bg-red { background-color: #dc3545; }

    /* Responsive Sidebar */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
      }

      .main-content {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar p-3">
  <h4 class="text-center mb-4">Admin Panel</h4>

  <a href="#"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
  <a href="#"><i class="bi bi-cart me-2"></i> Orders</a>
  <a href="#"><i class="bi bi-people me-2"></i> Users</a>
  <a href="#"><i class="bi bi-book me-2"></i> Courses</a>
  <a href="#"><i class="bi bi-file-earmark-text me-2"></i> Exams</a>
  <a href="#"><i class="bi bi-gear me-2"></i> Settings</a>
</div>

<!-- Main Content -->
<div class="main-content">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4 rounded">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold">Dashboard</span>
      <div class="d-flex">
        <input class="form-control me-2" type="search" placeholder="Search">
        <button class="btn btn-outline-primary">Search</button>
      </div>
    </div>
  </nav>

  <!-- Statistics Cards -->
  <div class="row g-4">

    <div class="col-md-3 col-sm-6">
      <div class="card shadow-sm p-3">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h6>Total Users</h6>
            <h4>1,250</h4>
          </div>
          <div class="icon-box bg-blue">
            <i class="bi bi-people"></i>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-3 col-sm-6">
      <div class="card shadow-sm p-3">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h6>Orders</h6>
            <h4>320</h4>
          </div>
          <div class="icon-box bg-green">
            <i class="bi bi-cart"></i>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-3 col-sm-6">
      <div class="card shadow-sm p-3">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h6>Courses</h6>
            <h4>58</h4>
          </div>
          <div class="icon-box bg-orange">
            <i class="bi bi-book"></i>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-3 col-sm-6">
      <div class="card shadow-sm p-3">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h6>Exams</h6>
            <h4>12</h4>
          </div>
          <div class="icon-box bg-red">
            <i class="bi bi-file-earmark-text"></i>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Table Section -->
  <div class="card mt-5 shadow-sm">
    <div class="card-header bg-white fw-bold">
      Recent Activity
    </div>
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Activity</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>John Doe</td>
            <td>Placed Order</td>
            <td><span class="badge bg-success">Completed</span></td>
          </tr>
          <tr>
            <td>2</td>
            <td>Jane Smith</td>
            <td>Registered</td>
            <td><span class="badge bg-primary">New</span></td>
          </tr>
          <tr>
            <td>3</td>
            <td>Mike Lee</td>
            <td>Attempted Exam</td>
            <td><span class="badge bg-warning">Pending</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
